name: Verificar código e snapshot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements.txt
      - run: pnpm test
      - run: python -m unittest discover -s tests
      - run: python scripts/validate_model.py
      - run: python scripts/validate_dataset.py --check
      - run: pnpm data:verify
      - run: pnpm build
      - name: Artefatos gerados não alteram o Git
        run: node -e "const {execFileSync}=require('node:child_process');if(execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim())process.exit(1)"
